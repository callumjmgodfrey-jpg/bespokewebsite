<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Callum Godfrey — Bespoke Selvedge Denim, Wellington NZ</title>
<meta name="description" content="Hand-cut, hand-sewn bespoke jeans made from Japanese selvedge denim. Based in Wellington, New Zealand. Apply for a commission.">
<meta property="og:title" content="Callum Godfrey — Bespoke Selvedge Denim">
<meta property="og:description" content="Hand-cut, hand-sewn bespoke jeans made from Japanese selvedge denim. Based in Wellington, New Zealand.">
<meta property="og:type" content="website">
<meta property="og:image" content="media/pdf_p1_img1.jpeg">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="tokens.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&family=Shippori+Mincho:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="animations.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--sans);
  background: #fff;
  color: #111;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ── NAV ── */
nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  padding: 28px 48px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  mix-blend-mode: difference;
}
.nav-logo { font-family: var(--serif); font-size: 15px; color: #fff; text-decoration: none; letter-spacing: 0.12em; font-weight: 400; }
.nav-right { display: flex; align-items: center; gap: 32px; }
.nav-link { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: #fff; text-decoration: none; font-weight: 400; transition: opacity 0.2s; }
.nav-link:hover { opacity: 0.5; }
.lang-dropdown-wrap { position: relative; }
.lang-dropdown-btn { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: #fff; background: none; border: none; cursor: pointer; font-family: var(--sans); padding: 0; }
.lang-dropdown-btn:hover { opacity: 0.5; }
.lang-dropdown-menu { display: none; position: absolute; top: calc(100% + 12px); right: 0; background: #141412; min-width: 160px; z-index: 200; }
.lang-dropdown-menu.open { display: block; }
.lang-dropdown-menu button { display: block; width: 100%; text-align: left; padding: 10px 16px; font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: rgba(255,255,255,0.5); background: none; border: none; border-bottom: 0.5px solid rgba(255,255,255,0.1); cursor: pointer; font-family: var(--sans); transition: color 0.15s; }
.lang-dropdown-menu button:last-child { border-bottom: none; }
.lang-dropdown-menu button:hover, .lang-dropdown-menu button.active { color: #fff; }
@media (max-width: 768px) {
  nav { padding: 20px 24px; }
  .nav-link:not(.nav-apply-link) { display: none; }
}

/* ── RED ACCENT ── */
:root { --red: #c0302a; }

/* ── TAGLINE (shared) ── */
.tagline {
  font-family: 'Shippori Mincho', serif;
  font-style: italic;
  font-size: clamp(14px, 1.4vw, 20px);
  letter-spacing: 0.02em;
  color: var(--red);
}
.tagline-white { color: #fff; }

/* ════════════════════════════════════
   SECTION 1 — Full bleed hero
   ════════════════════════════════════ */
.s1 {
  position: relative;
  width: 100%;
  height: 100vh;
  overflow: hidden;
}
.s1 img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  display: block;
}
.s1-tagline {
  position: absolute;
  bottom: 8%;
  left: 50%;
  transform: translateX(-50%);
  white-space: nowrap;
}

/* ════════════════════════════════════
   SECTION 2 — Editorial split
   ════════════════════════════════════ */
.s2 {
  position: relative;
  display: grid;
  grid-template-columns: 50% 50%;
  min-height: 100vh;
  background: #fff;
}

/* Left: large photo + rotated wordmark */
.s2-left {
  position: relative;
  overflow: hidden;
}
.s2-left img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center top;
  display: block;
}
.s2-wordmark {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  z-index: 2;
  display: flex;
  align-items: center;
  pointer-events: none;
}
.s2-wordmark span {
  font-family: 'Playfair Display', Georgia, serif;
  font-weight: 900;
  font-size: clamp(72px, 11vw, 160px);
  color: var(--red);
  line-height: 0.9;
  white-space: nowrap;
  writing-mode: vertical-rl;
  transform: rotate(180deg);
  letter-spacing: -0.02em;
}

/* Section 2 tagline — bottom of left area */
.s2-tagline {
  position: absolute;
  bottom: 5%;
  left: 50%;
  transform: translateX(-50%);
  white-space: nowrap;
}

/* Right: white + 3 stacked photos */
.s2-right {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: flex-end;
  padding: 48px 48px 48px 40px;
  gap: 6px;
}
.s2-right img {
  width: 75%;
  aspect-ratio: 16/10;
  object-fit: cover;
  display: block;
}

/* ════════════════════════════════════
   SECTION 3 — Full bleed lifestyle
   ════════════════════════════════════ */
.s3 {
  position: relative;
  width: 100%;
  height: 100vh;
  overflow: hidden;
}
.s3 img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center top;
  display: block;
}
.s3-tagline {
  position: absolute;
  bottom: 6%;
  left: 50%;
  transform: translateX(-50%);
  white-space: nowrap;
}

/* ════════════════════════════════════
   SECTION 4 — Studio grid + red stripe
   ════════════════════════════════════ */
.s4 {
  position: relative;
  display: grid;
  grid-template-columns: 64% 28% 8%;
  min-height: 100vh;
  background: #fff;
  overflow: hidden;
}

.s4-main {
  position: relative;
  overflow: hidden;
}
.s4-main img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center top;
  display: block;
}

.s4-stack {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 48px 0 48px 8px;
}
.s4-stack img {
  width: 100%;
  flex: 1;
  object-fit: cover;
  display: block;
}

.s4-stripe {
  background: var(--red);
}

/* Section 4 tagline */
.s4-tagline {
  position: absolute;
  bottom: 5%;
  left: 50%;
  transform: translateX(-50%);
  white-space: nowrap;
  z-index: 2;
}

/* ── RESPONSIVE ── */
@media (max-width: 768px) {
  .s2 { grid-template-columns: 1fr; min-height: auto; }
  .s2-left { height: 60vw; }
  .s2-right { align-items: center; padding: 24px; }
  .s2-right img { width: 100%; }
  .s2-wordmark span { font-size: clamp(48px, 14vw, 80px); }
  .s4 { grid-template-columns: 1fr; min-height: auto; }
  .s4-stripe { display: none; }
  .s4-stack { flex-direction: row; padding: 8px; height: 50vw; }
  .s4-main { height: 70vw; }
}
</style>
</head>
<body>

<div id="page-overlay"></div>

<!-- NAV -->
<nav>
  <a href="index.html" class="nav-logo">Callum Godfrey</a>
  <div class="nav-right">
    <a href="about.html" class="nav-link">About</a>
    <a href="process.html" class="nav-link">Process</a>
    <div class="lang-dropdown-wrap">
      <button class="lang-dropdown-btn" onclick="toggleLangMenu()" id="langBtn">EN</button>
      <div class="lang-dropdown-menu" id="langMenu">
        <button onclick="setNavLang('en')">EN — English</button>
        <button onclick="setNavLang('ja')">日本語</button>
        <button onclick="setNavLang('ko')">한국어</button>
        <button onclick="setNavLang('fr')">Français</button>
        <button onclick="setNavLang('de')">Deutsch</button>
      </div>
    </div>
    <a href="order.html" class="nav-link nav-apply-link" id="nav-apply-link">Order</a>
  </div>
</nav>

<!-- ═══════════════════════════════════
     SECTION 1 — Full bleed hero
     ═══════════════════════════════════ -->
<section class="s1">
  <img src="media/pdf_p1_img1.jpeg" alt="Made for myself, now I make for you">
  <p class="s1-tagline tagline">Made for myself, now I make for you</p>
</section>

<!-- ═══════════════════════════════════
     SECTION 2 — Editorial split
     ═══════════════════════════════════ -->
<section class="s2">

  <div class="s2-left">
    <img src="media/pdf_p2_img1.jpeg" alt="Callum Godfrey at the cutting table">
    <div class="s2-wordmark">
      <span>Callum Godfrey</span>
    </div>
    <p class="s2-tagline tagline">Made for myself, now I make for you</p>
  </div>

  <div class="s2-right">
    <img src="media/pdf_p2_img2.jpeg" alt="Hands at work" loading="lazy">
    <img src="media/pdf_p2_img3.jpeg" alt="Studio floor" loading="lazy">
    <img src="media/pdf_p2_img4.jpeg" alt="Cutting tools" loading="lazy">
  </div>

</section>

<!-- ═══════════════════════════════════
     SECTION 3 — Full bleed lifestyle
     ═══════════════════════════════════ -->
<section class="s3">
  <img src="media/pdf_p3_img1.jpeg" alt="Wearing the jeans" loading="lazy">
  <p class="s3-tagline tagline tagline-white">Made for myself, now I make for you</p>
</section>

<!-- ═══════════════════════════════════
     SECTION 4 — Studio grid + red stripe
     ═══════════════════════════════════ -->
<section class="s4">

  <div class="s4-main">
    <img src="media/pdf_p4_img3.jpeg" alt="Studio at work" loading="lazy">
  </div>

  <div class="s4-stack">
    <img src="media/pdf_p4_img1.jpeg" alt="Pattern cutting" loading="lazy">
    <img src="media/pdf_p4_img2.jpeg" alt="Pressing" loading="lazy">
  </div>

  <div class="s4-stripe"></div>

  <p class="s4-tagline tagline">Made for myself, now I make for you</p>

</section>

<script src="animations.js"></script>
<script>
function toggleLangMenu() {
  document.getElementById('langMenu').classList.toggle('open');
}
document.addEventListener('click', e => {
  const wrap = document.querySelector('.lang-dropdown-wrap');
  if (wrap && !wrap.contains(e.target)) document.getElementById('langMenu').classList.remove('open');
});

const langLabels = { en:'EN', ja:'日本語', ko:'한국어', fr:'FR', de:'DE' };
function setNavLang(lang) {
  document.getElementById('langMenu').classList.remove('open');
  document.getElementById('langBtn').textContent = langLabels[lang];
  document.querySelectorAll('.lang-dropdown-menu button').forEach(b => {
    b.classList.toggle('active', b.getAttribute('onclick') === `setNavLang('${lang}')`);
  });
  document.documentElement.lang = lang;
  sessionStorage.setItem('preferredLang', lang);
}
const saved = sessionStorage.getItem('preferredLang');
if (saved && saved !== 'en') setNavLang(saved);
</script>
</body>
</html>
